
<h2>Registered Students</h2>

@if (students.length > 0) {

  <table>
    <thead>
      <tr>
        <th>S.No</th>
        <th>Name</th>
        <th>Age</th>
        <th>Department</th>
        <th>Email</th>
      </tr>
    </thead>

    <tbody>
      @for (student of students; track $index) {
        <tr>
          <td>{{ $index + 1 }}</td>
          <td>{{ student.name }}</td>
          <td>{{ student.age }}</td>
          <td>{{ student.department }}</td>
          <td>{{ student.email }}</td>
        </tr>
      }
    </tbody>
  </table>

}
@else {
  <p>No students registered yet.</p>
}
